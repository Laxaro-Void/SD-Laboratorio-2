services:
  banco:
    build:
      context: ./Banco
    container_name: banco-container
    ports:
      - "5000:5000"
    environment:
      - "NAME=Banco"
      - "PORT=5000"
      - "BROKER_URL=broker:5001"
    networks:
      default:
        aliases:
          - "banco"

  broker:
    build:
      context: ./Broker
    container_name: broker-container
    ports:
      - "5001:5001"
    environment:
      - "NAME=Broker"
      - "PORT=5001"
    networks:
      default:
        aliases:
          - "broker"
  consumidor1:
    build:
      context: ./Consumidor
    ports:
      - "5002-5009:5002"
    volumes:
      - ./Consumidor/keys:/app/keys
    environment:
      - "NAME=Consumidor1"
      - "PORT=5002"
      - "BROKER_URL=broker:5001"

  consumidor2:
    build:
      context: ./Consumidor
    ports:
      - "5002-5009:5002"
    volumes:
      - ./Consumidor/keys:/app/keys
    environment:
      - "NAME=Consumidor2"
      - "PORT=5002"
      - "BROKER_URL=broker:5001"
  productor1:
    build:
      context: ./Productor
    ports:
      - "5003-5009:5003"
    volumes:
      - ./Productor/keys:/app/keys
    environment:
      - "NAME=DataClub"
      - "PORT=5003"
      - "BROKER_URL=broker:5001"

  productor2:
    build:
      context: ./Productor
    ports:
      - "5003-5009:5003"
    volumes:
      - ./Productor/keys:/app/keys
    environment:
      - "NAME=Dockers Night"
      - "PORT=5003"
      - "BROKER_URL=broker:5001"
    
  productor3:
    build:
      context: ./Productor
    ports:
      - "5003-5009:5003"
    volumes:
      - ./Productor/keys:/app/keys
    environment:
      - "NAME=GoLounge"
      - "PORT=5003"
      - "BROKER_URL=broker:5001"

  productor4:
    build:
      context: ./Productor
    ports:
      - "5003-5009:5003"
    volumes:
      - ./Productor/keys:/app/keys
    environment:
      - "NAME=GeorgieHouse"
      - "PORT=5003"
      - "BROKER_URL=broker:5001"

  dynamodb:
    build:
      context: ./DynamoDB
    container_name: dynamodb-container
    ports:
      - "8000-8010:8000"
    environment:
      - "NAME=DynamoDB"
      - "PORT=8000"
    networks:
      default:
        aliases:
          - "dynamodb"