syntax = "proto3";

option go_package = "./pbBancoUSM";
package pbBancoUSM;

service BancoUSM {
    rpc CheckIsAlive(Empty) returns (IsAliveResponde);
    rpc ProcessPayment(PaymentRequest) returns (PaymentResponse);
}

message Empty {

}

message IsAliveResponde {
    bool isAlive = 1;
}

message PaymentRequest {
    string uuid = 1;
    int32 amount = 2;
    string paymentMethod = 3; // e.g. "debito", "credito"
}

message PaymentResponse {
    bool success = 1;
    string message = 2;
}